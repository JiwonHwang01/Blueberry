name: Deploy to EC2

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
              
      - name: Initial Server Setup
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh ubuntu@$EC2_HOST '
            sudo apt update
            sudo apt upgrade -y
            sudo apt install -y python3-pip python3-venv python3-dev nginx git
            sudo apt install -y build-essential libssl-dev libffi-dev
            sudo apt install -y libjpeg-dev zlib1g-dev pkg-config libcairo2-dev

            mkdir -p ~/blueberry
            cd ~/blueberry

            rm -rf venv

            git clone https://github.com/JiwonHwang01/Blueberry.git .

            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            mkdir -p staticfiles media templates

            python manage.py migrate
            python manage.py collectstatic --noinput
          '

      - name: Setup Systemd Service
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh ubuntu@$EC2_HOST '
            sudo bash -c "cat > /etc/systemd/system/blueberry.service" << EOF
            [Unit]
            Description=Blueberry Gunicorn Service
            After=network.target

            [Service]
            User=ubuntu
            Group=www-data
            WorkingDirectory=/home/ubuntu/blueberry
            Environment="PATH=/home/ubuntu/blueberry/venv/bin"
            Environment="DJANGO_SETTINGS_MODULE=config.settings"
            ExecStart=/home/ubuntu/blueberry/venv/bin/gunicorn --workers 2 --bind unix:/home/ubuntu/blueberry/blueberry.sock config.wsgi:application --timeout 120
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
          '

      - name: Enable and Start Systemd Service
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh ubuntu@$EC2_HOST '
            sudo systemctl daemon-reload
            sudo systemctl enable blueberry
            sudo systemctl restart blueberry
          '

      - name: Setup Nginx Configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh ubuntu@$EC2_HOST '
            sudo bash -c "cat > /etc/nginx/sites-available/blueberry" << EOF
            server {
                listen 80;
                server_name _;

                client_max_body_size 20M;

                location = /favicon.ico {
                    access_log off;
                    log_not_found off;
                }

                location /static/ {
                    alias /home/ubuntu/blueberry/staticfiles/;
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                }

                location /media/ {
                    alias /home/ubuntu/blueberry/media/;
                    expires 1y;
                    add_header Cache-Control "public";
                }

                location / {
                    include proxy_params;
                    proxy_pass http://unix:/home/ubuntu/blueberry/blueberry.sock;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_connect_timeout 60s;
                    proxy_send_timeout 60s;
                    proxy_read_timeout 60s;
                }
            }
            EOF
          '

      - name: Enable and Start Systemd Service
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh ubuntu@$EC2_HOST '
            sudo ln -sf /etc/nginx/sites-available/blueberry /etc/nginx/sites-enabled
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl restart nginx
          '

      - name: Setup Permissions and Firewall
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh ubuntu@$EC2_HOST '
            sudo chown -R ubuntu:ubuntu /home/ubuntu/blueberry
            sudo chmod -R 775 /home/ubuntu/blueberry/staticfiles /home/ubuntu/blueberry/media
          '

      - name: Configure Firewall
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh ubuntu@$EC2_HOST '
            sudo ufw allow "Nginx Full"
            sudo ufw allow OpenSSH
            sudo ufw --force enable
          '

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh ubuntu@$EC2_HOST '
            cd ~/blueberry &&
            git reset --hard &&
            git clean -fd &&
            git pull origin master &&
            source venv/bin/activate &&
            pip install -r requirements.txt &&
            python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            sudo chown -R ubuntu:ubuntu ~/blueberry &&
            sudo chmod -R 775 ~/blueberry/staticfiles ~/blueberry/media &&
            sudo systemctl restart blueberry &&
            sudo systemctl restart nginx &&
            sudo systemctl status blueberry --no-pager &&
            sudo journalctl -u blueberry -n 20 --no-pager
          '
