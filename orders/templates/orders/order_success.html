{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0">
                <div class="card-body text-center p-5">
                    <div class="mb-4">
                        <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
                    </div>
                    <h2 class="card-title mb-4 fw-bold">주문이 완료되었습니다!</h2>
                    <p class="text-muted mb-5">주문이 성공적으로 접수되었습니다.<br> 감사합니다.</p>

                    <div class="d-grid gap-3">
                        <a href="{% url 'home' %}" class="btn btn-primary btn-lg">
                            <i class="fas fa-home me-2"></i>홈으로
                        </a>
                        <a href="{% url 'order_list' %}" class="btn btn-outline-primary btn-lg">
                            <i class="fas fa-list me-2"></i>주문 내역 보기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        border-radius: 15px;
        transition: transform 0.2s;
    }
    .card:hover {
        transform: translateY(-5px);
    }
    .btn {
        border-radius: 10px;
        padding: 12px 24px;
        font-weight: 500;
    }
    .btn-primary {
        background-color: #4CAF50 !important;
        border-color: #4CAF50 !important;
    }
    .btn-primary:hover {
        background-color: #45a049 !important;
        border-color: #45a049 !important;
    }
    
</style>
{% endblock %}
